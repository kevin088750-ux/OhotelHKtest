<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="房務點數">
<title>房務點數系統（示範版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --ink:#1D2B2E; --muted:#5B6B68; --line:#D3DDD9;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --accent-soft:#D8ECE8;
  --amber:#A86A12; --amber-soft:#F5E7CC; --danger:#B4382F; --tier:#C9DAD5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A1B; --surface:#192425; --ink:#E3ECEA; --muted:#93A4A0; --line:#2B3A3B;
    --accent:#3DB3A8; --accent-ink:#04201D; --accent-soft:#16352F;
    --amber:#E3A94C; --amber-soft:#3A2C14; --danger:#EC7B70; --tier:#2E4442;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A1B; --surface:#192425; --ink:#E3ECEA; --muted:#93A4A0; --line:#2B3A3B;
  --accent:#3DB3A8; --accent-ink:#04201D; --accent-soft:#16352F;
  --amber:#E3A94C; --amber-soft:#3A2C14; --danger:#EC7B70; --tier:#2E4442;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.ribbon{background:var(--amber-soft);font-size:13px;padding:6px 16px;text-align:center}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
h1{font-size:20px;font-weight:900;margin:0;flex:1;min-width:110px}
.month{display:flex;align-items:center;gap:6px;font-size:14px}
.month input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:14px}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.badge.admin{background:var(--ink);color:var(--surface)}
.badge.hk{background:var(--amber-soft);color:var(--amber)}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px}
.tabs{max-width:1080px;margin:0 auto;padding:0 8px;display:flex;gap:4px;min-height:8px}
.tab{border:0;background:none;padding:12px 12px 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:1080px;margin:0 auto;padding:16px 16px 96px}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:6px 0 0}

/* login */
.login{max-width:380px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.login h1{font-size:26px;margin:0 0 4px}
.login label{display:block;font-weight:700;margin:18px 0 6px}
.login input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;font-size:20px;letter-spacing:.04em}
.login .btn{width:100%;margin-top:12px;padding:12px}
.code{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.code b{font-size:20px;letter-spacing:.15em}
.demo{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.demo p{font-size:13px;color:var(--muted);margin:0 0 8px}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:6px;text-align:left}
.acc span{font-size:13px;color:var(--muted)}

/* my points (房務) */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.hero p{margin:0;color:var(--muted)}
.hero strong{display:block;font-size:64px;font-weight:900;line-height:1.05;letter-spacing:-.02em;margin:6px 0 2px}
.meter{height:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:14px 0 8px;position:relative}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.over i{background:var(--amber)}
.hero .state{font-weight:700;color:var(--ink)}
.hero .state.over{color:var(--amber)}
.stats{display:flex;gap:10px;margin-top:14px}
.stats div{flex:1;background:var(--bg);border-radius:10px;padding:8px 12px}
.stats b{display:block;font-size:22px}
.stats span{font-size:13px;color:var(--muted)}
.list h2{font-size:16px;margin:22px 0 8px}
.dayrow{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;text-align:left}
.dayrow b{font-size:17px}
.dayrow span{color:var(--muted);font-size:14px}
.dayrow strong{font-size:17px}
.daydetail{padding:4px 4px 14px;border-bottom:1px solid var(--line)}

/* day strip / staff / ledger / board */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.day{flex:0 0 auto;width:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 5px;text-align:center;line-height:1.2}
.day b{display:block;font-size:17px}
.day small{display:block;font-size:11px;color:var(--muted)}
.day.we small{color:var(--danger)}
.day .dot{display:block;height:4px;width:4px;border-radius:50%;margin:4px auto 0;background:transparent}
.day.has .dot{background:var(--accent)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
.day[aria-pressed="true"] .dot{background:var(--surface)}
.staff{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.person{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 16px;display:flex;align-items:baseline;gap:8px;font-weight:700}
.person span{font-weight:500;font-size:13px;color:var(--muted)}
.person[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.person[aria-pressed="true"] span{color:inherit;opacity:.85}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:860px){.grid{grid-template-columns:340px minmax(0,1fr);align-items:start}.ledger{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px)}}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.ledger h2{font-size:15px;font-weight:500;color:var(--muted);margin:0}
.total{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px}
.total strong{font-size:44px;font-weight:900;line-height:1.1}
.total span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px 3px 9px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip em{font-style:normal;color:var(--muted);font-size:12px}
.chip i{font-style:normal;color:var(--muted);font-size:15px;line-height:1}
.chip.cont{background:var(--amber-soft);border-color:transparent}
span.chip{padding-right:9px}
.empty{color:var(--muted);font-size:14px;margin:4px 0}
.mode{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.mode button{border:0;background:var(--surface);padding:8px 6px;font-weight:700;line-height:1.3}
.mode button small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.mode button+button{border-left:1px solid var(--line)}
.mode button[aria-pressed="true"][data-m="out"]{background:var(--accent);color:var(--accent-ink)}
.mode button[aria-pressed="true"][data-m="cont"]{background:var(--amber);color:var(--surface)}
.mode button[aria-pressed="true"] small{color:inherit;opacity:.85}
.entry{display:flex;gap:8px}
.entry input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-size:17px}
.board h3{font-size:14px;font-weight:700;color:var(--muted);margin:4px 0 8px}
.floor{margin-bottom:18px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.key{position:relative;border:1.5px solid var(--tier);background:var(--surface);border-radius:12px 12px 12px 22px;padding:16px 4px 6px;text-align:center;line-height:1.1;min-height:64px}
.key::before{content:"";position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;border:1.5px solid var(--tier);background:var(--bg)}
.key b{display:block;font-size:18px;font-weight:700}
.key small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.key.top{border-color:var(--accent)}
.key.top::before{border-color:var(--accent)}
.key.mine{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.key.mine small{color:inherit;opacity:.85}
.key.mine::before{background:var(--accent-ink);border-color:var(--accent-ink)}
.key.cont{background:var(--amber);border-color:var(--amber);color:var(--surface)}
.key.cont small{color:inherit;opacity:.9}
.key.cont::before{background:var(--surface);border-color:var(--surface)}
.key.other{border-style:dashed;color:var(--muted)}
.key .by{position:absolute;top:3px;right:5px;font-size:11px;font-weight:700;color:var(--amber)}

/* monthly */
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0;font-size:15px}
.card strong{display:block;font-size:30px;font-weight:900;line-height:1.2}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .over{color:var(--amber);font-weight:700;font-size:14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
.scroll table{min-width:520px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.scroll th:first-child,.scroll td:first-child{position:sticky;left:0;background:var(--surface)}
thead th{font-weight:700}
tbody tr.we td:first-child{color:var(--danger)}
td.zero{color:var(--line)}
tfoot td,tfoot th{font-weight:700;border-top:1px solid var(--line)}
tfoot tr:first-child td,tfoot tr:first-child th{border-top:2px solid var(--ink);font-weight:900}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--accent-soft)}

/* admin */
.set{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.set h2{font-size:17px;margin:0 0 4px}
.users td,.users th{white-space:normal;text-align:left;vertical-align:middle}
.users input,.users select,.adduser input,.adduser select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.users .off td{opacity:.55}
.adduser{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 110px auto;gap:8px;margin-top:12px}
@media (max-width:640px){.adduser{grid-template-columns:1fr 1fr}.users thead{display:none}.users tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}.users td{border:0;padding:0}}
.roles{font-size:14px;margin:8px 0 0;padding-left:18px;color:var(--muted)}
.ref{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px 12px;font-size:14px;margin-top:10px}
.ref span{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.pe{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 16px;margin-top:12px}
.pe div{display:flex;gap:6px;align-items:center}
.pe input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px}
.pe .fixed{padding:7px 9px;flex:1;font-weight:700}
.inline input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px}
.hist{font-size:13px;color:var(--muted);margin:10px 0 0;padding-left:18px}

.toast{position:fixed;left:50%;bottom:0;transform:translateX(-50%);padding:0 0 env(safe-area-inset-bottom,0px);z-index:20;pointer-events:none}
.toast div{background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 16px;margin-bottom:16px;font-size:14px;max-width:90vw;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast.show div{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast div{transition:none}}

/* print */
#printArea{display:none}
.rpt{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#000;background:#fff;font-size:12px;line-height:1.45}
.rpt h1{font-size:20px;margin:0 0 2px}.rpt .meta{margin:0 0 10px}
.rpt table{border-collapse:collapse;width:100%;font-size:12px}
.rpt th,.rpt td{border:1px solid #000;padding:4px 6px;text-align:right;white-space:normal;background:#fff;color:#000}
.rpt th:first-child,.rpt td:first-child{text-align:left;white-space:nowrap}
.rpt td.rooms{text-align:left}
.rpt thead th{background:#eee;text-align:center}
.rpt table.m th,.rpt table.m td{padding:2px 6px}
.rpt tfoot th,.rpt tfoot td{font-weight:700}
.rpt .sign{display:flex;gap:48px;margin-top:36px}.rpt .sign span{flex:1;border-top:1px solid #000;padding-top:4px}
@page{size:A4;margin:12mm}
@media print{
  :root{padding:0}
  body{background:#fff}
  body::before,#app,.toast{display:none!important}
  #printArea{display:block}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"><div></div></div>
<div id="printArea"></div>

<script>
(function(){
"use strict";

/* ================= 基本設定 ================= */
var CONT="續", BASE="0000-00", DEF_TH=300, LS="hk-demo:v1";
var DEFAULT_POINTS={"301":1.3,"302":1.3,"303":1.3,"305":1.3,"306":1.3,"307":1.3,"308":1.1,"310":1,"311":1,"312":1.3,"313":1.3,"315":1.1,"316":1.2,"317":1.3,"318":1.2,"320":1.1,"321":1.1,"322":1.2,"323":1.1,"325":1.1,"326":1.3,"327":1,"328":1,"330":1,"332":1,
"501":1.3,"502":1.3,"503":1.3,"505":1.3,"506":1,"507":1,"508":1.1,"510":1,"511":1,"512":1,"513":1.3,"515":1,"516":1.1,"517":1,"518":1.3,"519":1,"520":1,"521":1.1,"522":1.1,"523":1.1,"525":1,"526":1.3,"527":1,"528":1,"530":1.3,"532":1,
"601":1.3,"602":1.3,"603":1.3,"605":1.3,"606":1.3,"607":1.3,"608":1.1,"610":1,"611":1,"612":1,"613":1.3,"615":1,"616":1.3,"617":1,"618":1.3,"619":1,"620":1,"621":1.3,"622":1.1,"623":1.1,"625":1,"626":1.3,"627":1,"628":1,"630":1,"續":0.5};
var ROLE={admin:"主管",desk:"櫃檯",hk:"房務"};
var WEEK=["日","一","二","三","四","五","六"];

/* ================= 小工具 ================= */
function $(id){return document.getElementById(id);}
function pad(n){return (n<10?"0":"")+n;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function r2(x){return Math.round(x*100)/100;}
function fmt(x){var v=r2(x);return (Math.round(Math.abs(v)*100)%10)?v.toFixed(2):v.toFixed(1);}
function tfmt(v){return v%1?fmt(v):String(v);}
function daysIn(m){var p=m.split("-");return new Date(+p[0],+p[1],0).getDate();}
function wd(m,d){var p=m.split("-");return new Date(+p[0],+p[1]-1,d).getDay();}
function zhMonth(m){var p=m.split("-");return p[0]+"年"+(+p[1])+"月";}
function zhDate(m,d){return zhMonth(m)+d+"日（週"+WEEK[wd(m,d)]+"）";}
function normPhone(s){return String(s||"").replace(/\D/g,"");}
function showPhone(p){return p.length===10?p.slice(0,4)+"-"+p.slice(4,7)+"-"+p.slice(7):p;}
function byStr(a,b){return a.localeCompare(b,"zh-Hant",{numeric:true});}
var now=new Date(), thisMonth=now.getFullYear()+"-"+pad(now.getMonth()+1);

/* ================= 資料（示範版存在這個瀏覽器） ================= */
var DB;
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}
function load(){try{DB=JSON.parse(localStorage.getItem(LS));}catch(e){DB=null;} if(!DB||!DB.users)DB=seed();}
function seed(){
  var users=[
    {id:"u1",name:"林主管",phone:"0912000001",role:"admin",active:true},
    {id:"u2",name:"櫃檯小陳",phone:"0912000002",role:"desk",active:true},
    {id:"u3",name:"黃海權",phone:"0912000003",role:"hk",active:true},
    {id:"u4",name:"朱芬宜",phone:"0912000004",role:"hk",active:true},
    {id:"u5",name:"吳錦雲",phone:"0912000005",role:"hk",active:true},
    {id:"u6",name:"黃玉文",phone:"0912000006",role:"hk",active:true},
    {id:"u7",name:"陳瑋琳",phone:"0912000007",role:"hk",active:true}];
  var d={users:users,tables:[{from:BASE,points:DEFAULT_POINTS}],thresholds:[{from:BASE,value:DEF_TH}],entries:{},session:null};
  // 示範用：本月今天以前的假資料
  var seedN=11;function rnd(){seedN=(seedN*9301+49297)%233280;return seedN/233280;}
  var rooms=Object.keys(DEFAULT_POINTS).filter(function(k){return k!==CONT;}),m={};
  for(var day=1;day<now.getDate();day++){
    var pool=rooms.slice().sort(function(){return rnd()-.5;}),at=0;
    users.filter(function(u){return u.role==="hk";}).forEach(function(u){
      var n=11+Math.floor(rnd()*6),list=[];
      for(var i=0;i<n&&at<pool.length;i++,at++)list.push(rnd()<.25?CONT+pool[at]:pool[at]);
      m[day+"_"+u.id]=list;
    });
  }
  d.entries[thisMonth]=m;
  return d;
}
load();

/* ================= 狀態 ================= */
var S={month:thisMonth,day:now.getDate(),staffId:null,view:null,mode:"out",editPts:null,editTh:null,otp:null,loginErr:"",openDay:null,scrollDay:true};
var POINTS={},ROOMS=[],FLOORS=[];

function me(){if(!DB.session)return null;var u=userById(DB.session.uid);return u&&u.active?u:null;}
function userById(id){return DB.users.filter(function(u){return u.id===id;})[0];}
function isAdmin(){var u=me();return !!u&&u.role==="admin";}
function canEnter(){var u=me();return !!u&&(u.role==="admin"||u.role==="desk");}
function hkActive(){return DB.users.filter(function(u){return u.role==="hk"&&u.active;});}
function monthStaff(){
  var m=DB.entries[S.month]||{};
  return DB.users.filter(function(u){return u.role==="hk"&&(u.active||Object.keys(m).some(function(k){return k.split("_")[1]===u.id&&m[k].length;}));});
}
function get(d,uid){var m=DB.entries[S.month];return (m&&m[d+"_"+uid])||[];}
function setRooms(d,uid,list){var m=DB.entries[S.month]||(DB.entries[S.month]={});if(list.length)m[d+"_"+uid]=list;else delete m[d+"_"+uid];save();}
function isCont(r){return String(r).charAt(0)===CONT;}
function base(r){return isCont(r)?String(r).slice(1):String(r);}
function ptOf(r){return isCont(r)?(POINTS[CONT]||0):(POINTS[r]||0);}
function pts(list){var s=0;(list||[]).forEach(function(r){s+=ptOf(r);});return r2(s);}
function sorted(list){return list.slice().sort(function(a,b){return a.from<b.from?-1:a.from>b.from?1:0;});}
function tableFor(m){var pick=null;sorted(DB.tables).forEach(function(t){if(t.from<=m)pick=t;});return pick||sorted(DB.tables)[0];}
function thresh(){var pick=null;sorted(DB.thresholds).forEach(function(t){if(t.from<=S.month)pick=t;});return pick?+pick.value:DEF_TH;}
function applyTable(){
  var t=tableFor(S.month);POINTS={};
  Object.keys(t.points).forEach(function(k){POINTS[k]=+t.points[k];});
  if(!(CONT in POINTS))POINTS[CONT]=0.5;
  ROOMS=Object.keys(POINTS).filter(function(k){return k!==CONT;}).sort(byStr);
  FLOORS=[];
  ROOMS.forEach(function(r){var f=/^\d{3,}$/.test(r)?r.slice(0,-2)+" 樓":"其他";var g=FLOORS.filter(function(x){return x.f===f;})[0];if(!g){g={f:f,rooms:[]};FLOORS.push(g);}g.rooms.push(r);});
}
function tally(list){var o=0,c=0;list.forEach(function(r){if(isCont(r))c++;else o++;});return {out:o,cont:c};}
function personMonth(uid){
  var x={pts:0,out:0,cont:0},n=daysIn(S.month);
  for(var d=1;d<=n;d++){var l=get(d,uid),k=tally(l);x.pts+=pts(l);x.out+=k.out;x.cont+=k.cont;}
  x.pts=r2(x.pts);x.cnt=x.out+x.cont;x.over=Math.max(0,r2(x.pts-thresh()));return x;
}
applyTable();

var tt;function toast(msg){var el=$("toast");el.firstChild.textContent=msg;el.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){el.classList.remove("show");},3200);}
function arm(btn,label,fn){
  if(btn.dataset.armed){clearTimeout(btn._t);reset();fn();return;}
  btn.dataset.orig=btn.textContent;btn.dataset.armed="1";btn.textContent=label;btn.classList.add("warn");
  btn._t=setTimeout(reset,3500);
  function reset(){if(!btn.dataset.armed)return;delete btn.dataset.armed;btn.textContent=btn.dataset.orig;btn.classList.remove("warn");}
}
function download(name,text,type){
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

  return '<p class="note">新的門檻從你選的月份開始套用，之前月份不會改變。</p>'+
    '<div class="row inline"><label>從 <input type="month" data-in="th-from" value="'+esc(e.from)+'"> 開始</label><label>門檻 <input type="number" data-in="th-value" min="1" step="1" value="'+esc(e.value)+'" style="width:100px"> 點</label></div>'+
    '<p class="err" id="thErr"></p><div class="row"><button class="btn primary" type="button" data-act="thSave">儲存門檻</button><button class="btn" type="button" data-act="thCancel">取消</button></div>';
}

/* ================= 報表 ================= */
function dailyReport(){
  var ps=hkActive().concat(monthStaff().filter(function(u){return !u.active&&get(S.day,u.id).length;})),to=0,tc=0,tp=0;
  var rows=ps.map(function(u){
    var l=get(S.day,u.id),out=[],ct=[];
    l.forEach(function(r){if(isCont(r))ct.push(base(r)||"未填房號");else out.push(r);});
    var v=pts(l);to+=out.length;tc+=ct.length;tp+=v;
    return '<tr><td>'+esc(u.name)+'</td><td class="rooms">'+esc(out.join("、"))+'</td><td class="rooms">'+esc(ct.join("、"))+'</td><td>'+out.length+'</td><td>'+ct.length+'</td><td>'+fmt(v)+'</td></tr>';
  }).join("");
  var date=zhDate(S.month,S.day);
  return {file:"房務日報_"+S.month+"-"+pad(S.day)+".html",title:"房務每日報表 "+date,
    body:'<h1>房務每日報表</h1><p class="meta">'+date+'</p><table><thead><tr><th>房務人員</th><th>退房房號</th><th>續住房號</th><th>退房間數</th><th>續住間數</th><th>點數</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><th>合計</th><td></td><td></td><td>'+to+'</td><td>'+tc+'</td><td>'+fmt(tp)+'</td></tr></tfoot></table><div class="sign"><span>填表人</span><span>主管</span></div>'};
}
function monthlyReport(){
  return {file:"房務月報_"+S.month+".html",title:"房務點數月報表 "+zhMonth(S.month),
    body:'<h1>房務點數月報表</h1><p class="meta">'+zhMonth(S.month)+'，超額門檻 '+tfmt(thresh())+' 點</p><table class="m">'+dayTable(false)+'</table><div class="sign"><span>製表人</span><span>主管</span></div>'};
}
function printReport(r){$("printArea").innerHTML='<div class="rpt">'+r.body+'</div>';var o=document.title;document.title=r.title;window.print();setTimeout(function(){document.title=o;},1000);}
function downloadReport(r){
  var css=Array.prototype.map.call(document.querySelectorAll("style"),function(s){return s.textContent;}).join("").match(/\.rpt[^}]*\}/g).join("")+"@page{size:A4;margin:12mm}";
  download(r.file,'<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(r.title)+'</title><style>body{margin:16px;background:#fff}'+css+'.np{font:inherit;font-size:16px;padding:8px 16px;margin-bottom:16px}@media print{.np{display:none}body{margin:0}}</style></head><body><button class="np" onclick="window.print()">列印</button><div class="rpt">'+r.body+'</div></body></html>',"text/html;charset=utf-8");
}
function csv(){
  var ps=monthStaff(),n=daysIn(S.month),q=function(s){return '"'+String(s).replace(/"/g,'""')+'"';},t={};
  ps.forEach(function(u){t[u.id]=personMonth(u.id);});
  var lines=[["日期"].concat(ps.map(function(u){return u.name;})).map(q).join(",")];
  for(var d=1;d<=n;d++)lines.push([q(S.month+"-"+pad(d))].concat(ps.map(function(u){return fmt(pts(get(d,u.id)));})).join(","));
  [["總點數","pts",1],["退房間數","out"],["續住間數","cont"],["總間數","cnt"],["超額點數","over",1]].forEach(function(r){
    lines.push([q(r[0])].concat(ps.map(function(u){return r[2]?fmt(t[u.id][r[1]]):t[u.id][r[1]];})).join(","));
  });
  download("房務點數_"+S.month+".csv","\uFEFF"+lines.join("\r\n"),"text/csv;charset=utf-8");
}

/* ================= 主要繪製 ================= */
function render(){
  var u=me(),app=$("app");
  if(!u){app.innerHTML=vLogin();var f=$(S.otp?"otp":"phone");if(f)f.focus();return;}
  var allowed=u.role==="hk"?["mine"]:tabsFor(u).map(function(t){return t[0];});
  if(allowed.indexOf(S.view)<0)S.view=allowed[0];
  var body=S.view==="mine"?vMine(u):S.view==="daily"?vDaily():S.view==="monthly"?vMonthly():vAdmin();
  app.innerHTML=vShell(u,body);
  if(S.view==="daily"&&S.scrollDay){var sel=document.querySelector('.day[aria-pressed="true"]');if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:"nearest",inline:"center"});S.scrollDay=false;}
}

/* ================= 動作 ================= */
var ACT={
  tab:function(el){S.view=el.dataset.v;S.editPts=S.editTh=null;S.scrollDay=true;render();window.scrollTo(0,0);},
  logout:function(){DB.session=null;save();S.otp=null;S.loginErr="";S.view=null;render();},
  fillPhone:function(el){S.otp=null;S.loginErr="";render();$("phone").value=el.dataset.phone;$("phone").focus();},
  otpBack:function(){S.otp=null;S.loginErr="";render();},
  day:function(el){S.day=+el.dataset.d;render();},
  staff:function(el){S.staffId=el.dataset.id;render();},
  mode:function(el){S.mode=el.dataset.m;render();},
  key:function(el){var r=el.dataset.r,i=findRoom(r);if(i>=0)removeAt(i);else addRoom(S.mode==="cont"?CONT+r:r);render();},
  chip:function(el){removeAt(+el.dataset.i);render();},
  undo:function(){var l=get(S.day,S.staffId);if(l.length){removeAt(l.length-1);render();}},
  clear:function(el){arm(el,"再按一次清除",function(){var n=userById(S.staffId).name;setRooms(S.day,S.staffId,[]);render();toast("已清除 "+n+" 這天的登記。");});},
  "goto":function(el){S.day=+el.dataset.d;S.view="daily";S.scrollDay=true;render();window.scrollTo(0,0);},
  openDay:function(el){var d=+el.dataset.d;S.openDay=S.openDay===d?null:d;render();},
  printDay:function(){printReport(dailyReport());},
  dlDay:function(){downloadReport(dailyReport());},
  printMonth:function(){printReport(monthlyReport());},
  dlMonth:function(){downloadReport(monthlyReport());},
  csv:csv,
  uToggle:function(el){if(!isAdmin())return;var u=userById(el.dataset.id);u.active=!u.active;save();render();toast(u.name+(u.active?" 已啟用，可以登入。":" 已停用，無法再登入。"));},
  uDel:function(el){if(!isAdmin())return;var u=userById(el.dataset.id);arm(el,"再按一次刪除",function(){DB.users=DB.users.filter(function(x){return x.id!==u.id;});save();render();toast("已刪除 "+u.name+"。");});},
  ptsEdit:function(){if(!isAdmin())return;var rows=ROOMS.map(function(k){return {room:k,pt:String(POINTS[k])};});rows.push({room:CONT,pt:String(POINTS[CONT]),fixed:true});S.editPts={from:S.month,rows:rows};render();},
  ptsCancel:function(){S.editPts=null;render();},
  ptsAdd:function(){var f=S.editPts.rows.pop();S.editPts.rows.push({room:"",pt:"1"});S.editPts.rows.push(f);render();var ins=document.querySelectorAll('[data-in="pts-room"]');if(ins.length)ins[ins.length-1].focus();},
  ptsRm:function(el){S.editPts.rows.splice(+el.dataset.i,1);render();},
  ptsSave:function(){
    var e=S.editPts,out={},err="";
    if(!/^\d{4}-\d{2}$/.test(e.from||""))err="請選擇開始適用的月份。";
    e.rows.forEach(function(r){
      if(err)return;var room=r.fixed?CONT:String(r.room).trim(),p=parseFloat(r.pt);
      if(!room){err="有房號是空白的，請填寫或刪除那一列。";return;}
      if(room===CONT&&!r.fixed){err="「續」不能當成房號。";return;}
      if(room in out){err="房號 "+room+" 重複了。";return;}
      if(isNaN(p)||p<0){err=(r.fixed?"續住":"房號 "+room)+" 的點數要填數字。";return;}
      out[room]=r2(p);
    });
    if(err){$("ptsErr").textContent=err;return;}
    DB.tables=DB.tables.filter(function(t){return t.from!==e.from;});DB.tables.push({from:e.from,points:out});save();
    S.editPts=null;applyTable();render();toast("已儲存，"+zhMonth(e.from)+"起使用新的點數。");
  },
  thEdit:function(){if(!isAdmin())return;S.editTh={from:S.month,value:String(thresh())};render();},
  thCancel:function(){S.editTh=null;render();},
  thSave:function(){
    var e=S.editTh,v=parseFloat(e.value);
    if(!/^\d{4}-\d{2}$/.test(e.from||"")){$("thErr").textContent="請選擇開始的月份。";return;}
    if(isNaN(v)||v<=0){$("thErr").textContent="門檻要填大於 0 的數字。";return;}
    DB.thresholds=DB.thresholds.filter(function(t){return t.from!==e.from;});DB.thresholds.push({from:e.from,value:r2(v)});save();
    S.editTh=null;render();toast("已儲存，"+zhMonth(e.from)+"起門檻改為 "+tfmt(r2(v))+" 點。");
  },
  reset:function(el){arm(el,"再按一次重設",function(){var uid=DB.session&&DB.session.uid;DB=seed();if(uid&&userById(uid))DB.session={uid:uid};save();S.editPts=S.editTh=null;applyTable();render();toast("已恢復示範資料。");});}
};
var FORM={
  phone:function(){
    var p=normPhone($("phone").value);
    if(!/^09\d{8}$/.test(p)){S.loginErr="請輸入 09 開頭的 10 碼手機號碼。";render();$("phone").value=p;return;}
    var u=DB.users.filter(function(x){return x.phone===p;})[0];
    if(!u||!u.active){S.loginErr="這個號碼還沒有開通，請聯絡主管。";render();$("phone").value=p;return;}
    S.otp={phone:p,code:String(100000+Math.floor(Math.random()*900000))};S.loginErr="";render();
  },
  otp:function(){
    var c=normPhone($("otp").value);
    if(c!==S.otp.code){S.loginErr="驗證碼不正確，請再試一次。";render();return;}
    var u=DB.users.filter(function(x){return x.phone===S.otp.phone;})[0];
    if(!u||!u.active){S.otp=null;S.loginErr="這個號碼已被停用，請聯絡主管。";render();return;}
    DB.session={uid:u.id};save();S.otp=null;S.loginErr="";S.view=null;S.month=thisMonth;S.day=now.getDate();S.scrollDay=true;applyTable();render();
  },
  room:function(){
    var inp=$("roomInput"),v=inp.value.trim().replace(/\s+/g,""),err=$("entryErr");
    if(!v)return;
    var c=S.mode==="cont";
    if(/^續住?/.test(v)){c=true;v=v.replace(/^續住?/,"");}
    if(!v){err.textContent="請輸入續住的房號。";return;}
    if(!(v in POINTS)||v===CONT){err.textContent="找不到房號 "+v+"，請確認後再輸入。";return;}
    if(findRoom(v)>=0){err.textContent=v+" 已經在今天的清單裡。";return;}
    addRoom(c?CONT+v:v);render();$("roomInput").focus();
  },
  uadd:function(){
    if(!isAdmin())return;
    var name=$("nuName").value.trim(),p=normPhone($("nuPhone").value),role=$("nuRole").value,err=$("uErr");
    if(!name){err.textContent="請輸入姓名。";return;}
    if(!/^09\d{8}$/.test(p)){err.textContent="手機號碼要是 09 開頭的 10 碼。";return;}
    if(DB.users.some(function(u){return u.phone===p;})){err.textContent="這個號碼已經在名單上了。";return;}
    var max=0;DB.users.forEach(function(u){var n=parseInt(u.id.slice(1),10)||0;if(n>max)max=n;});
    DB.users.push({id:"u"+(max+1),name:name,phone:p,role:role,active:true});save();render();
    toast("已新增 "+name+"（"+ROLE[role]+"），用 "+showPhone(p)+" 就能登入。");
  }
};
var CHANGE={
  uname:function(el){var u=userById(el.dataset.id),v=el.value.trim();if(!v){toast("姓名不能空白。");render();return;}u.name=v;save();render();},
  uphone:function(el){
    var u=userById(el.dataset.id),p=normPhone(el.value);
    if(!/^09\d{8}$/.test(p)){toast("手機號碼要是 09 開頭的 10 碼。");render();return;}
    if(DB.users.some(function(x){return x.phone===p&&x.id!==u.id;})){toast("這個號碼已經有人使用。");render();return;}
    u.phone=p;save();render();toast(u.name+" 的手機號碼已更新，之後要用新號碼登入。");
  },
  urole:function(el){var u=userById(el.dataset.id);u.role=el.value;save();render();toast(u.name+" 的角色改為「"+ROLE[u.role]+"」。");}
};

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  var f=ACT[el.dataset.act];if(f)f(el,e);
});
/* 不用表單送出，改用按鈕與 Enter 鍵，避免在預覽或內嵌畫面中被瀏覽器擋住 */
function runForm(el){var f=el.closest("[data-form]");if(f&&FORM[f.dataset.form])FORM[f.dataset.form]();}
document.addEventListener("click",function(e){var b=e.target.closest("[data-submit]");if(b&&!b.disabled)runForm(b);});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||e.isComposing)return;
  var t=e.target;if(t.tagName!=="INPUT"||!t.closest("[data-form]"))return;
  e.preventDefault();runForm(t);
});
document.addEventListener("submit",function(e){
  var f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  var h=FORM[f.dataset.form];if(h)h();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="month"){if(!t.value)return;S.month=t.value;S.day=S.month===thisMonth?now.getDate():1;S.openDay=null;S.editPts=S.editTh=null;S.scrollDay=true;applyTable();render();return;}
  if(t.dataset.ch&&CHANGE[t.dataset.ch]&&isAdmin())CHANGE[t.dataset.ch](t);
});
document.addEventListener("input",function(e){
  var t=e.target,k=t.dataset.in;if(!k)return;
  if(k==="pts-from")S.editPts.from=t.value;
  else if(k==="pts-room")S.editPts.rows[+t.dataset.i].room=t.value;
  else if(k==="pts-pt")S.editPts.rows[+t.dataset.i].pt=t.value;
  else if(k==="th-from")S.editTh.from=t.value;
  else if(k==="th-value")S.editTh.value=t.value;
  var er=$("ptsErr")||$("thErr");if(er)er.textContent="";
  if(t.id==="roomInput"&&$("entryErr"))$("entryErr").textContent="";
});
document.addEventListener("input",function(e){if(e.target.id==="roomInput"&&$("entryErr"))$("entryErr").textContent="";});

render();
})();
</script>
